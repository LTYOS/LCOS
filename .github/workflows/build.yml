name: Build LCOS.dylib

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build LCOS.dylib
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          if [[ "$VERSION" != "dev" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [[ -z "$LATEST_TAG" ]]; then LATEST_TAG="v1.0.0"; fi
            TAG="$LATEST_TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION; release tag: $TAG"

      - name: Build LCOS.dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Embedding LCOS version: $VERSION"
          clang++ -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fmodules \
            -DLCOS_VERSION_STRING=\"${VERSION}\" \
            -I. \
            -ICore -IUI -IGestures -ISettings -IBackground \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework UserNotifications \
            -framework CoreFoundation \
            -o LCOS.dylib \
            Core/*.m UI/*.m Gestures/*.m Settings/*.m Background/*.m \
            -undefined dynamic_lookup

      - name: Package artifact
        run: |
          mkdir -p dist
          cp LCOS.dylib dist/LCOS.dylib

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCOS.dylib
          path: dist/LCOS.dylib
          retention-days: 30

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LCOS ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/LCOS.dylib
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
