name: Build LCOS.dylib

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LCOS.dylib
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git tags

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install || true
          sleep 5

      - name: Determine next version
        id: version
        run: |
          # Get latest tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          
          # Parse version and increment patch
          VERSION_NUM=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          
          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"
          
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Build LCOS.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK" ]; then
            echo "iOS SDK not found, trying macOS SDK..."
            SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo "")
          fi
          echo "SDK: $SDK"
          
          clang++ -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fmodules \
            -I. \
            -ICore -IUI -IGestures -ISettings -IBackground \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework UserNotifications \
            -framework CoreFoundation \
            -o LCOS.dylib \
            Core/*.m UI/*.m Gestures/*.m Settings/*.m Background/*.m \
            -undefined dynamic_lookup

      - name: Verify dylib
        run: |
          file LCOS.dylib
          ls -lh LCOS.dylib
          xcrun lipo -info LCOS.dylib || true

      - name: Package artifacts with version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Version from step: $VERSION"
          mkdir -p dist
          cp LCOS.dylib dist/lcos_${VERSION}.dylib
          echo "After cp, dist contents:"
          ls -la dist/
          cd dist
          zip -r lcos_${VERSION}.dylib.zip lcos_${VERSION}.dylib
          echo "After zip, dist contents:"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcos-${{ steps.version.outputs.version }}.dylib
          path: dist/lcos_${{ steps.version.outputs.version }}.dylib
          retention-days: 30

      - name: Create and push tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LCOS ${{ steps.version.outputs.version }}
          body: |
            Automated release from CI
            Version: ${{ steps.version.outputs.version }}
          files: |
            dist/lcos_${{ steps.version.outputs.version }}.dylib
            dist/lcos_${{ steps.version.outputs.version }}.dylib.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}