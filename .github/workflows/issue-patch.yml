name: Apply local code replacement from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-patch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >
      github.event.issue.user.login == 'LTYOS' &&
      github.event.sender.login == 'LTYOS' &&
      contains(github.event.issue.labels.*.name, 'patch-request')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save Issue body as data
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue-body.md

      - name: Apply exact one-time replacement
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          body = pathlib.Path("issue-body.md").read_text(encoding="utf-8")

          path_match = re.search(
              r"(?m)^LCOS-FILE:[ \t]*([^\r\n]+?)[ \t]*$",
              body,
          )
          base_match = re.search(
              r"(?m)^LCOS-BASE:[ \t]*([A-Za-z0-9._/-]+)[ \t]*$",
              body,
          )
          old_match = re.search(
              r"(?ms)^LCOS-OLD:[ \t]*\r?\n```[^\r\n]*\r?\n"
              r"(.*?)\r?\n```[ \t]*\r?\n(?=LCOS-NEW:)",
              body,
          )
          new_match = re.search(
              r"(?ms)^LCOS-NEW:[ \t]*\r?\n```[^\r\n]*\r?\n"
              r"(.*?)\r?\n```[ \t]*\r?\n?LCOS-END:[ \t]*$",
              body,
          )

          if not path_match or not old_match or not new_match:
              print(
                  "Required format: LCOS-FILE, LCOS-OLD, "
                  "LCOS-NEW, and LCOS-END.",
                  file=sys.stderr,
              )
              sys.exit(1)

          relative_path = path_match.group(1).strip()
          target = pathlib.PurePosixPath(relative_path)

          if (
              not relative_path
              or target.is_absolute()
              or "\\" in relative_path
              or "\x00" in relative_path
              or any(part in ("", ".", "..") for part in target.parts)
              or relative_path == ".git"
              or relative_path.startswith(".git/")
          ):
              print(f"Unsafe target path: {relative_path}", file=sys.stderr)
              sys.exit(1)

          base = base_match.group(1) if base_match else "main"
          if (
              base.startswith("-")
              or base.startswith("/")
              or base.endswith("/")
              or ".." in base
              or "@{" in base
              or base == "HEAD"
          ):
              print(f"Invalid base branch: {base}", file=sys.stderr)
              sys.exit(1)

          destination = pathlib.Path.cwd().joinpath(*target.parts)
          if not destination.is_file():
              print(f"Target file does not exist: {relative_path}", file=sys.stderr)
              sys.exit(1)

          source = destination.read_text(encoding="utf-8")
          old_code = old_match.group(1)
          new_code = new_match.group(1)
          occurrences = source.count(old_code)

          if occurrences != 1:
              print(
                  f"Expected exactly one old-code match; found {occurrences}. "
                  "Add more surrounding context to make it unique.",
                  file=sys.stderr,
              )
              sys.exit(1)

          updated = source.replace(old_code, new_code, 1)
          destination.write_text(updated, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={relative_path}\n")
              output.write(f"base={base}\n")
          PY

          if git diff --quiet -- "${{ steps.patch.outputs.path }}"; then
            echo "Replacement produced no change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push patch branch
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/issue-patch-${{ github.event.issue.number }}
          TARGET_PATH: ${{ steps.patch.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if gh api \
            "repos/${{ github.repository }}/git/ref/heads/$BRANCH" \
            >/dev/null 2>&1; then
            echo "Branch already exists; commit was already pushed. Continue to PR creation."
            exit 0
          fi

          git switch -c "$BRANCH"
          git add -- "$TARGET_PATH"
          git commit -m \
            "fix: apply Issue #${{ github.event.issue.number }} patch to $TARGET_PATH"
          git push origin "$BRANCH"

      - name: Create pull request
        if: steps.patch.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/issue-patch-${{ github.event.issue.number }}
          LCOS_BASE: ${{ steps.patch.outputs.base }}
          TARGET_PATH: ${{ steps.patch.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          cat > pr-body.md <<EOF
          自动应用 Issue #${{ github.event.issue.number }} 的局部代码替换。

          - 文件：\`$TARGET_PATH\`
          - Base：\`$LCOS_BASE\`
          - 来源：${{ github.event.issue.html_url }}
          - 旧代码必须且只能匹配一次，否则不会提交。
          - 请人工 Review 后再合并。
          EOF

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$LCOS_BASE" \
            --head "$BRANCH" \
            --title "Issue #${{ github.event.issue.number }}：更新 $TARGET_PATH" \
            --body-file pr-body.md)

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR link on Issue
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "已创建局部替换 PR，请 Review 后合并：$PR_URL"